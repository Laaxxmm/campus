name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learncrew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/learncrew
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/learncrew_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/learncrew_e2e
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      CRON_SECRET: ci-cron-secret-0123456789
      AUTH_URL: http://localhost:3100
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Create test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE learncrew_test" -c "CREATE DATABASE learncrew_e2e"
      - run: node scripts/migrate.mjs
      - run: DATABASE_URL=$TEST_DATABASE_URL node scripts/migrate.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run bank:validate
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm audit --omit=dev --audit-level=high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
